name: focus_timer
description: "Minimal focus timer: Pomodoro sessions, daily goals and honest statistics."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Version is pinned by flutter_localizations.
  intl: any
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# shared_preferences_android 2.5.x crashes the release build on start
# (NoSuchMethodError via JNI, #281). Remove once a fixed version passes the
# smoke start in CI.
dependency_overrides:
  shared_preferences_android: 2.4.28

flutter:
  generate: true
  uses-material-design: true

  fonts:
    # Display face for large numbers and headings (OFL, variable weight).
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Variable.ttf
    # Text face for everything else (OFL, variable weight).
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-Variable.ttf
