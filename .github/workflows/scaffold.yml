name: Scaffold Flutter project

# One-off: generates the Flutter project files (Android) and commits them.
# Existing files are not overwritten by `flutter create`.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --org de.maestrodev --project-name focus_timer --platforms android .
      - run: flutter pub get && flutter test
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: generate Flutter project (flutter create)" || echo "nothing to commit"
          git push
