name: CI

# Branches are tested through their (draft) pull request only, so every push
# costs one run instead of two (Actions minutes are limited for private repos).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Skip if project not scaffolded yet
        id: guard
        run: |
          if [ -f pubspec.yaml ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - run: flutter pub get
        if: steps.guard.outputs.ok == 'true'
      - name: Generate localizations
        if: steps.guard.outputs.ok == 'true'
        run: if [ -f l10n.yaml ]; then flutter gen-l10n; fi
      - name: Analyze
        if: steps.guard.outputs.ok == 'true'
        run: flutter analyze 2>&1 | tee analyze.log; exit ${PIPESTATUS[0]}
      - name: Test
        if: always() && steps.guard.outputs.ok == 'true'
        run: flutter test --reporter expanded 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      # Post failure output as a commit comment so it can be read via the API;
      # passing test lines are dropped so the failures fit into the comment.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### CI failed'; echo '```'; tail -c 30000 analyze.log 2>/dev/null; echo; echo '--- test ---'; grep -vE ': loading ' test.log 2>/dev/null | awk '!/^[0-9]+:[0-9]+ \+[0-9]+/ || /\[E\]/' | tail -c 30000; echo '```'; } > report.md
          jq -Rs '{body: .}' report.md > body.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha || github.sha }}/comments" -d @body.json > /dev/null

  # Build the APK only on main; for pull requests only with “[apk]” in the PR
  # title (saves ~6 min per TDD cycle).
  build-apk:
    needs: test
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.title, '[apk]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # The run number as build number: every APK has a higher version code.
      - run: flutter build apk --release --build-number=${{ github.run_number }}
        env:
          FOCUS_KEYSTORE_PASSWORD: ${{ secrets.FOCUS_KEYSTORE_PASSWORD }}
      # Only APKs signed with the Focus release key may be published, otherwise
      # phones refuse the update (“App not installed”).
      - name: Check release signature
        if: github.ref == 'refs/heads/main'
        run: |
          if [ ! -f android/app/focus-release.sha256 ]; then
            echo "::error::No release key yet. Set the secret FOCUS_KEYSTORE_PASSWORD and run the workflow 'Create release key'."
            exit 1
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'a-f' 'A-F')
          EXPECTED=$(tr -d ':\n ' < android/app/focus-release.sha256)
          echo "APK certificate: $CERT"
          if [ "$CERT" != "$EXPECTED" ]; then
            echo "::error::APK is not signed with the Focus release key. Check the secret FOCUS_KEYSTORE_PASSWORD."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: focus_timer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      # On main: publish the APK as release “latest” (direct download on the phone)
      - name: Release latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          cp build/app/outputs/flutter-apk/app-release.apk focus_timer.apk
          NOTES="Built automatically from ${GITHUB_SHA::7} (build ${{ github.run_number }}). To install, download focus_timer.apk on your phone and open it."
          # Recreate the release on every build, so its date and the
          # `latest` tag match this build. The download link
          # (…/releases/download/latest/focus_timer.apk) stays the same.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest focus_timer.apk --target "$GITHUB_SHA" \
            --title "Focus (latest) · build ${{ github.run_number }}" --notes "$NOTES"
