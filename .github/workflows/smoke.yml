name: Smoke start

# Installs a published APK on an Android emulator, cold-starts it and records
# logcat and a screenshot – for start-up bugs that only show on a device.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to test (preview or latest)
        default: preview
      api:
        description: Android API level
        default: '34'

permissions:
  contents: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.release }}" -R "${{ github.repository }}" -p focus_timer.apk
      - name: Start on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r focus_timer.apk
            adb logcat -c
            adb shell am start -W -n de.maestrodev.focus_timer/.MainActivity
            sleep 25
            adb exec-out screencap -p > screen.png || true
            { adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity"; adb shell pidof de.maestrodev.focus_timer || echo "PROCESS NOT RUNNING"; } > summary.txt 2>&1 || true
            adb logcat -d -v time > logcat.txt || true
            grep -E "flutter|Flutter|AndroidRuntime|FATAL|focus_timer|ANR|SplashScreen| E " logcat.txt | tail -150 > relevant.txt || true
      - name: Report as a commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Smoke start: ${{ inputs.release }} on API ${{ inputs.api }}"
            echo '```'
            cat summary.txt 2>/dev/null
            echo '--- logcat (filtered) ---'
            cut -c1-300 relevant.txt 2>/dev/null | tail -150
            echo '```'
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ inputs.release }}
          path: |
            screen.png
            logcat.txt
