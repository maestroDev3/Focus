name: Create release key

# One-off: creates the release signing key from the secret
# FOCUS_KEYSTORE_PASSWORD, so the password never leaves GitHub and the user's
# password manager. Commits the password-protected keystore and its SHA-256
# fingerprint (CI checks every release APK against it).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create keystore
        env:
          FOCUS_KEYSTORE_PASSWORD: ${{ secrets.FOCUS_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$FOCUS_KEYSTORE_PASSWORD" ]; then
            echo "::error::Set the repository secret FOCUS_KEYSTORE_PASSWORD first."
            exit 1
          fi
          if [ -f android/app/focus-release.jks ]; then
            echo "::error::A release key already exists. Replacing it would break updates."
            exit 1
          fi
          keytool -genkeypair -storetype PKCS12 \
            -keystore android/app/focus-release.jks -alias focus \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$FOCUS_KEYSTORE_PASSWORD" -keypass "$FOCUS_KEYSTORE_PASSWORD" \
            -dname "CN=Focus, O=maestrodev, C=DE"
          keytool -list -keystore android/app/focus-release.jks \
            -storepass "$FOCUS_KEYSTORE_PASSWORD" \
            | grep 'SHA-256' | sed 's/.*(SHA-256): //' > android/app/focus-release.sha256
          echo "Fingerprint: $(cat android/app/focus-release.sha256)"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f android/app/focus-release.jks android/app/focus-release.sha256
          git commit -m "chore: add release signing key"
          git push
